<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Torna in ReWavier</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0D0D0F">
  <style>
    :root {
      --bg: #0D0D0F;
      --surface: #1A1A1E;
      --text: #F5F5F7;
      --muted: #8E8E93;
      --accent: #FF6B35;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 2rem 1.25rem;
    }
    main { max-width: 22rem; text-align: center; }
    p { margin: 0 0 0.75rem; color: var(--muted); }
    a {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.85rem 1.4rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <p>Stai tornando in ReWavier…</p>
    <p>Se l’app non si apre, tocca il pulsante.</p>
    <a id="open" href="rewavier://oauth">Apri ReWavier</a>
  </main>
  <script>
    (function () {
      var query = window.location.search || '';
      var hash = window.location.hash || '';
      var target = 'rewavier://oauth' + query + hash;
      var link = document.getElementById('open');
      if (link) {
        link.setAttribute('href', target);
      }
      window.location.replace(target);
    })();
  </script>
</body>
</html>
